name: Tests

on:
  push:
    branches: [main, windows-support]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.9'
          - os: ubuntu-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'
          - os: windows-latest
            python: '3.9'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install named timezone data on Windows
        if: runner.os == 'Windows'
        run: python -m pip install tzdata
      - run: python -B -m unittest discover -s tests -v
      - name: Install Codex for Windows integration check
        if: runner.os == 'Windows' && matrix.python == '3.13'
        run: npm install --global @openai/codex
      - name: Check native Codex hook discovery and selected commands
        if: runner.os == 'Windows' && matrix.python == '3.13'
        run: python -B tests/check_codex_registration.py
